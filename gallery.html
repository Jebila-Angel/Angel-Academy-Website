    <script>
      const searchInput = document.querySelector("#gallery-search");
      const tagButtons = document.querySelectorAll(".gallery-tag");
      const gallery = document.querySelector("#gallery-photos");
      const photos = [...gallery.querySelectorAll(".gallery-photo")];
      const count = document.querySelector("#gallery-count");
      const emptyMessage = document.querySelector("#gallery-empty");
      let activeTag = "all";

      const getPhotoNumber = (photo) => {
        const match = photo.querySelector("img").getAttribute("src").match(/\((\d+)\)\.png$/);
        return match ? Number(match[1]) : 0;
      };

      photos
        .sort((first, second) => getPhotoNumber(second) - getPhotoNumber(first))
        .forEach((photo) => gallery.append(photo));

      function filterPhotos() {
        const query = searchInput.value.trim().toLowerCase();
        let visibleCount = 0;

        photos.forEach((photo) => {
          const matchesTag =
            activeTag === "all" || photo.dataset.tags.split(" ").includes(activeTag);
          const matchesSearch = `${photo.dataset.title} ${photo.dataset.tags}`
            .toLowerCase()
            .includes(query);
          const isVisible = matchesTag && matchesSearch;

          photo.hidden = !isVisible;
          if (isVisible) visibleCount += 1;
        });

        count.textContent = `Showing ${visibleCount} of ${photos.length} photos`;
        emptyMessage.hidden = visibleCount > 0;
      }

      searchInput.addEventListener("input", filterPhotos);
      tagButtons.forEach((button) => {
        button.addEventListener("click", () => {
          activeTag = button.dataset.tag;
          tagButtons.forEach((tagButton) => {
            const isActive = tagButton === button;
            tagButton.classList.toggle("is-active", isActive);
            tagButton.setAttribute("aria-pressed", String(isActive));
          });
          filterPhotos();
        });
      });

      filterPhotos();
    </script>
